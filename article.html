<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Article | The Stuyvesant Speculator</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    /* Article-specific styling */
    #article-container {
        max-width: 900px;
        margin: 2rem auto;
        background-color: #fff;
        padding: 2rem;
        border: 1px solid #ccc;
        border-radius: 8px;
        box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        font-family: "Georgia", serif;
        line-height: 1.6;
    }

    #article-container h1 {
        text-align: center;
        font-size: 2rem;
        color: #222;
        margin-bottom: 0.5rem;
    }

    #article-container .meta {
        text-align: center;
        font-size: 0.85rem;
        color: #555;
        margin-bottom: 1.5rem;
    }

    #article-container img {
        display: block;
        max-width: 100%;
        height: auto;
        margin: 1rem auto;
        border-radius: 4px;
    }

    #article-container p {
        margin-bottom: 1rem;
    }

    .back-link {
        display: block;
        max-width: 900px;
        margin: 1rem auto 3rem auto;
        text-align: center;
        text-decoration: none;
        color: #b22222;
        font-weight: bold;
        transition: color 0.2s;
    }

    .back-link:hover {
        color: #ff5555;
    }
  </style>
</head>
<body>
  <main>
    <div id="article-container">
      <!-- Article content will be injected here by article.js -->
    </div>

    <a href="index.html" class="back-link">← Back to home</a>
  </main>

  <script src="article.js" defer></script>
</body>
</html>
