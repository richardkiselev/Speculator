<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Stuyvesant Speculator</title>
    <link rel="stylesheet" href="styles.css">
</head>
    <script>
async function loadArticles() {
  try {
    const res = await fetch('articles.json');
    const data = await res.json();
    const container = document.getElementById('articles');
    container.innerHTML = '';

    data.forEach(article => {
      const el = document.createElement('div');
      el.className = 'article';
      el.innerHTML = `
        <img src="${article.thumbnail}" alt="${article.title}" class="thumbnail">
        <div class="article-text">
          <h3>${article.title}</h3>
          <p class="meta">${article.author} | ${article.date}</p>
          <p>${article.description}</p>
          <a href="article.html?id=${article.id}" class="read-more">Read More →</a>
        </div>
      `;
      container.appendChild(el);
    });
  } catch (err) {
    console.error("Error loading articles:", err);
  }
}

loadArticles();
</script>

<body>
    <!-- Navigation Bar -->
    <header class="navbar">
        <nav>
            <ul>
                <li><a href="https://forms.gle/GhaFdkvVv3nat8QZ7" target="_blank">📝 Submit an Article</a></li>
                <li><a href="https://discord.gg/aHk7kU7A9R" target="_blank">💬 Join the Discord Server</a></li>
            </ul>
        </nav>
    </header>

    <!-- Main Content -->
    <main>
        <div class="logo-container">
            <img src="https://i.ibb.co/Xf0G7w0k/spec.png" alt="The Stuyvesant Speculator Logo">
        </div>
        <h1 class="headline">The Stuyvesant Speculator</h1>
        <p class="tagline">Read, write, love!</p>

        <section class="content">
            <h2>Latest Issue</h2>
            <p>Welcome to <strong>The Stuyvesant Speculator</strong> — your #1 source for completely <s>fabricated</s> factual news at Stuyvesant High School.</p>
            <section id="articles" class="articles"></section>
        </section>
    </main>

    <footer>
        <p>© 2025 The Stuyvesant Speculator | A Student-Run Publication</p>
    </footer>
</body>
</html>
